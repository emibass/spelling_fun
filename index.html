<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Spelling Fun</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(180deg, #fff6d6, #fffdf7);
}

body {
  overflow: auto;
  touch-action: pan-x pan-y pinch-zoom;
}

.app {
  width: 100%;
  min-height: 100svh;
  padding: clamp(8px, 1.6vw, 18px);
  display: flex;
  flex-direction: column;
  gap: clamp(6px, 1vw, 12px);
}

.header {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: clamp(8px, 1.4vw, 14px);
  flex-shrink: 0;
}

h1 {
  margin: 0;
  font-size: clamp(30px, 5.2vw, 58px);
  line-height: 1.05;
  color: #ff4d5a;
  text-align: center;
  text-shadow: 0 2px 0 #fff;
}

.sound-btn {
  width: clamp(48px, 7vw, 70px);
  height: clamp(48px, 7vw, 70px);
  border: none;
  border-radius: clamp(12px, 2vw, 18px);
  background: #8d63ff;
  color: white;
  font-size: clamp(24px, 3.4vw, 34px);
  font-weight: bold;
  flex: 0 0 auto;
}

.main {
  flex: 1;
  display: grid;
  grid-template-rows: auto auto auto auto auto auto;
  gap: clamp(6px, 1vw, 12px);
  align-items: center;
}

.picture-box {
  width: min(54vw, 380px);
  margin: 0 auto;
  background: white;
  border-radius: clamp(16px, 2.5vw, 24px);
  padding: clamp(8px, 1.5vw, 16px);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
}

.picture {
  font-size: clamp(78px, 14vw, 145px);
  line-height: 1;
  text-align: center;
}

.prompt {
  text-align: center;
  font-size: clamp(22px, 3.6vw, 36px);
  font-weight: bold;
  margin: 0;
}

.answer {
  display: flex;
  justify-content: center;
  gap: clamp(5px, 1vw, 10px);
  flex-wrap: wrap;
  min-height: clamp(48px, 7vw, 76px);
}

.slot {
  width: clamp(38px, 6vw, 62px);
  height: clamp(48px, 7vw, 76px);
  border-radius: clamp(10px, 1.5vw, 16px);
  background: white;
  border: clamp(2px, 0.5vw, 4px) solid #d9dfeb;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(26px, 4.5vw, 42px);
  font-weight: bold;
  position: relative;
}

.slot {
  color: #20242c;
}

.slot.hint {
  color: #c6ccd6;
}

.slot.hint::after {
  content: "";
  position: absolute;
  bottom: clamp(8px, 1.3vw, 12px);
  width: 45%;
  height: 4px;
  background: #d7dce5;
  border-radius: 8px;
}

.message {
  text-align: center;
  font-size: clamp(20px, 3.3vw, 34px);
  font-weight: bold;
  min-height: clamp(28px, 4vw, 42px);
  margin: 0;
}

.correct {
  color: #159c34;
}

.try {
  color: #e67a00;
}

.keyboard {
  width: 100%;
  max-width: 980px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: clamp(5px, 0.9vw, 9px);
}

.keyboard-row {
  display: flex;
  justify-content: center;
  gap: clamp(4px, 0.8vw, 8px);
}

.keyboard-row:nth-child(2) {
  padding-left: min(4vw, 38px);
  padding-right: min(4vw, 38px);
}

.keyboard-row:nth-child(3) {
  padding-left: min(9vw, 86px);
  padding-right: min(9vw, 86px);
}

.key {
  flex: 1 1 0;
  max-width: 78px;
  min-width: 0;
  min-height: clamp(42px, 6.5vw, 62px);
  border: none;
  border-radius: clamp(8px, 1.4vw, 14px);
  color: white;
  font-size: clamp(20px, 3.5vw, 31px);
  font-weight: bold;
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.2);
}

.key:nth-child(7n+1) { background: #ff5d5d; }
.key:nth-child(7n+2) { background: #ff9838; }
.key:nth-child(7n+3) { background: #ffc93d; }
.key:nth-child(7n+4) { background: #52c95a; }
.key:nth-child(7n+5) { background: #45a2ff; }
.key:nth-child(7n+6) { background: #8a63ff; }
.key:nth-child(7n) { background: #ff69a6; }

.controls {
  display: flex;
  justify-content: center;
  gap: clamp(10px, 2vw, 20px);
  margin: 0;
  flex-shrink: 0;
  padding-bottom: env(safe-area-inset-bottom);
}

.control-btn {
  min-width: clamp(130px, 20vw, 190px);
  min-height: clamp(48px, 7vw, 66px);
  border: none;
  border-radius: clamp(12px, 2vw, 18px);
  color: white;
  font-size: clamp(22px, 3.5vw, 32px);
  font-weight: bold;
}

.clear-btn {
  background: #8a63ff;
}

.next-btn {
  background: #55c84b;
}

button {
  touch-action: manipulation;
}

@media (orientation: landscape) {
  .picture-box {
    width: min(36vw, 320px);
  }

  .picture {
    font-size: clamp(70px, 12vw, 126px);
  }

  .picture.two-emoji {
    font-size: clamp(46px, 8vw, 82px);
  }

  .keyboard {
    max-width: 900px;
  }

  .key {
    min-height: clamp(38px, 6vw, 56px);
  }
}

@media (max-height: 760px) {
  .app {
    padding: 6px 10px;
    gap: 4px;
  }

  h1 {
    font-size: clamp(28px, 4.6vw, 48px);
  }

  .sound-btn {
    width: 48px;
    height: 48px;
    font-size: 24px;
  }

  .picture-box {
    width: min(40vw, 260px);
    padding: 8px;
  }

  .picture {
    font-size: clamp(62px, 10vw, 105px);
  }

  .picture.two-emoji {
    font-size: clamp(42px, 7vw, 72px);
  }

  .prompt {
    font-size: clamp(20px, 3vw, 30px);
  }

  .slot {
    width: clamp(34px, 5vw, 50px);
    height: clamp(42px, 6vw, 60px);
    font-size: clamp(22px, 3.5vw, 34px);
  }

  .key {
    min-height: clamp(34px, 5.4vw, 48px);
    font-size: clamp(18px, 3vw, 26px);
  }

  .control-btn {
    min-height: 44px;
    font-size: clamp(20px, 3vw, 28px);
  }
}

@media (max-width: 700px) {
  .picture-box {
    width: min(72vw, 340px);
  }

  .keyboard-row:nth-child(2),
  .keyboard-row:nth-child(3) {
    padding-left: 0;
    padding-right: 0;
  }

  .controls {
    padding-bottom: 10px;
  }
}

</style>
</head>

<body>

<div class="app">

  <div class="header">
    <button class="sound-btn" id="soundBtn">🔊</button>
    <h1>⭐ Spelling Fun ⭐</h1>
  </div>

  <div class="main">

    <div class="picture-box">
      <div class="picture" id="picture">🍎</div>
    </div>

    <div class="prompt">Spell the word</div>

    <div class="answer" id="answer"></div>

    <div class="message" id="message"></div>

    <div class="keyboard" id="keyboard"></div>

    <div class="controls">
      <button class="control-btn clear-btn" id="clearBtn">Clear</button>
      <button class="control-btn next-btn" id="nextBtn">Next</button>
    </div>

  </div>
</div>

<script>

const words = [
  { word: "APPLE", picture: "🍎" },
  { word: "SHOES", picture: "👞👟" },
  { word: "BOAT", picture: "🚤" },
  { word: "ORANGE", picture: "🍊" },
  { word: "FLAMINGO", picture: "🦩" },
  { word: "AIRPLANE", picture: "✈️" },
  { word: "BUS", picture: "🚌" },
  { word: "CAR", picture: "🚗" },
  { word: "BOOK", picture: "📘" },
  { word: "PHONE", picture: "📱" },
  { word: "TABLET", picture: "📲" },
  { word: "FRIES", picture: "🍟" },
  { word: "GRAPES", picture: "🍇" },
  { word: "COAT", picture: "🧥" },
  { word: "YES", picture: "👍" },
  { word: "NO", picture: "👎" },
  { word: "TRAIN", picture: "🚆" },
  { word: "PENGUIN", picture: "🐧" },
  { word: "TREE", picture: "🌳" },
  { word: "BEE", picture: "🐝" },
  { word: "BIRD", picture: "🐦" },
  { word: "SCOOTER", picture: "🛴" },
  { word: "HELMET", picture: "🚴🪖" }
];

let current = 0;
let typed = "";

const answer = document.getElementById("answer");
const keyboard = document.getElementById("keyboard");
const picture = document.getElementById("picture");
const message = document.getElementById("message");

function currentWord(){
  return words[current].word;
}

function drawSlots(){
  answer.innerHTML = "";
  currentWord().split("").forEach((letter,i)=>{
    const div = document.createElement("div");
    div.className = typed[i] ? "slot" : "slot hint";
    div.textContent = typed[i] || letter;
    answer.appendChild(div);
  });
}

function getVoice(){
  const voices = speechSynthesis.getVoices();
  return voices.find(v=>v.lang==="en-GB") || voices[0];
}

function speak(text){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-GB";
  u.voice = getVoice();
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function playWrong(){
  const ctx = new (window.AudioContext||window.webkitAudioContext)();
  const o = ctx.createOscillator();
  const g = ctx.createGain();

  o.connect(g);
  g.connect(ctx.destination);

  o.type="sawtooth";
  o.frequency.value=180;

  g.gain.value=0.12;

  o.start();

  o.frequency.exponentialRampToValueAtTime(90, ctx.currentTime+0.25);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.25);

  o.stop(ctx.currentTime+0.25);
}

function playCelebrate(){
  const ctx = new (window.AudioContext||window.webkitAudioContext)();

  [523,659,784].forEach((freq,i)=>{
    const o = ctx.createOscillator();
    const g = ctx.createGain();

    o.connect(g);
    g.connect(ctx.destination);

    o.type="triangle";
    o.frequency.value=freq;

    const t=ctx.currentTime + i*0.12;

    g.gain.setValueAtTime(0.001,t);
    g.gain.linearRampToValueAtTime(0.15,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.32);

    o.start(t);
    o.stop(t+0.32);
  });
}

function pressLetter(letter){

  if(typed.length >= currentWord().length) return;

  const expected = currentWord()[typed.length];

  if(letter === expected){
    speak(letter);
    typed += letter;
    drawSlots();

    if(typed === currentWord()){
      setTimeout(()=>{
        message.textContent = "Great Job! 🎉";
        message.className = "message correct";
        playCelebrate();
      },1000);
    }

  } else {

    message.textContent = "Try Again 🙂";
    message.className = "message try";

    setTimeout(()=>{
      playWrong();
    },1000);

  }
}

function drawKeyboard(){

  keyboard.innerHTML = "";

  const rows = [
    "QWERTYUIOP",
    "ASDFGHJKL",
    "ZXCVBNM"
  ];

  rows.forEach(r=>{

    const row = document.createElement("div");
    row.className = "keyboard-row";

    r.split("").forEach(letter=>{

      const btn = document.createElement("button");
      btn.className = "key";
      btn.textContent = letter;

      btn.onclick = ()=>pressLetter(letter);

      row.appendChild(btn);

    });

    keyboard.appendChild(row);

  });

}

function nextWord(){
  current = (current + 1) % words.length;
  typed = "";
  message.textContent = "";
  updatePicture();
  drawSlots();
  speak(currentWord().toLowerCase());
}

document.getElementById("nextBtn").onclick = nextWord;

document.getElementById("clearBtn").onclick = ()=>{
  typed = "";
  message.textContent = "";
  drawSlots();
};

document.getElementById("soundBtn").onclick = ()=>{
  speak(currentWord().toLowerCase());
};

function updatePicture(){
  picture.textContent = words[current].picture;
  picture.className = words[current].picture.length > 2 ? "picture two-emoji" : "picture";
}

updatePicture();

drawSlots();
drawKeyboard();

</script>

</body>
</html>
